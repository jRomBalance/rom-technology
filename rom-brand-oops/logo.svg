<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <!-- Chip body gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <!-- Green accent gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d6a4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40916c;stop-opacity:1" />
    </linearGradient>
    <!-- Pin gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Circuit trace pattern -->
    <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L10 20 L10 10 L20 10" stroke="#1e3a2f" stroke-width="0.8" fill="none" opacity="0.4"/>
      <path d="M40 20 L30 20 L30 30 L20 30" stroke="#1e3a2f" stroke-width="0.8" fill="none" opacity="0.4"/>
      <circle cx="10" cy="10" r="1.5" fill="#2d6a4f" opacity="0.3"/>
      <circle cx="30" cy="30" r="1.5" fill="#2d6a4f" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)"/>
  <!-- Circuit pattern overlay -->
  <circle cx="200" cy="200" r="195" fill="url(#circuit)" opacity="0.6"/>
  <!-- Border ring -->
  <circle cx="200" cy="200" r="193" fill="none" stroke="#2d6a4f" stroke-width="1.5" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#1e3a2f" stroke-width="0.5" opacity="0.4"/>

  <!-- ── CHIP BODY ── -->
  <rect x="105" y="130" width="190" height="140" rx="12" ry="12"
        fill="url(#chipGrad)" filter="url(#shadow)"/>
  <!-- Chip top edge highlight -->
  <rect x="105" y="130" width="190" height="3" rx="2"
        fill="#334155" opacity="0.8"/>
  <!-- Chip inner border -->
  <rect x="108" y="133" width="184" height="134" rx="10" ry="10"
        fill="none" stroke="#334155" stroke-width="1" opacity="0.6"/>

  <!-- Green accent bar top -->
  <rect x="105" y="130" width="190" height="5" rx="3"
        fill="url(#greenGrad)" opacity="0.9"/>

  <!-- ── LEFT PINS (4 pins) ── -->
  <!-- Pin 1 -->
  <rect x="72" y="148" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="72" y="148" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 2 -->
  <rect x="72" y="168" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="72" y="168" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 3 -->
  <rect x="72" y="188" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="72" y="188" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 4 -->
  <rect x="72" y="208" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="72" y="208" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 5 -->
  <rect x="72" y="228" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="72" y="228" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 6 -->
  <rect x="72" y="248" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="72" y="248" width="4" height="10" rx="1" fill="#64748b"/>

  <!-- ── RIGHT PINS (4 pins) ── -->
  <!-- Pin 1 -->
  <rect x="295" y="148" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="324" y="148" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 2 -->
  <rect x="295" y="168" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="324" y="168" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 3 -->
  <rect x="295" y="188" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="324" y="188" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 4 -->
  <rect x="295" y="208" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="324" y="208" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 5 -->
  <rect x="295" y="228" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="324" y="228" width="4" height="10" rx="1" fill="#64748b"/>
  <!-- Pin 6 -->
  <rect x="295" y="248" width="33" height="10" rx="2" fill="url(#pinGrad)"/>
  <rect x="324" y="248" width="4" height="10" rx="1" fill="#64748b"/>

  <!-- ── CHIP NOTCH (top center) ── -->
  <path d="M185 130 Q200 118 215 130" fill="#0a0a0a" stroke="#334155" stroke-width="1"/>

  <!-- ── INNER CHIP DETAIL ── -->
  <!-- Die area -->
  <rect x="130" y="152" width="140" height="96" rx="4"
        fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <!-- Die grid lines -->
  <line x1="130" y1="175" x2="270" y2="175" stroke="#1e3a2f" stroke-width="0.5" opacity="0.5"/>
  <line x1="130" y1="200" x2="270" y2="200" stroke="#1e3a2f" stroke-width="0.5" opacity="0.5"/>
  <line x1="130" y1="225" x2="270" y2="225" stroke="#1e3a2f" stroke-width="0.5" opacity="0.5"/>
  <line x1="165" y1="152" x2="165" y2="248" stroke="#1e3a2f" stroke-width="0.5" opacity="0.5"/>
  <line x1="200" y1="152" x2="200" y2="248" stroke="#1e3a2f" stroke-width="0.5" opacity="0.5"/>
  <line x1="235" y1="152" x2="235" y2="248" stroke="#1e3a2f" stroke-width="0.5" opacity="0.5"/>

  <!-- ── ROM TEXT ── -->
  <!-- Shadow/glow layer -->
  <text x="200" y="213" font-family="'Arial Black', 'Impact', sans-serif"
        font-size="52" font-weight="900" text-anchor="middle"
        fill="#2d6a4f" opacity="0.4" filter="url(#glow)">ROM</text>
  <!-- Main text -->
  <text x="200" y="213" font-family="'Arial Black', 'Impact', sans-serif"
        font-size="52" font-weight="900" text-anchor="middle"
        fill="#ffffff" letter-spacing="4">ROM</text>
  <!-- Green underline accent -->
  <rect x="148" y="220" width="104" height="3" rx="1.5" fill="url(#greenGrad)"/>

  <!-- ── CORNER DOTS (circuit nodes) ── -->
  <circle cx="120" cy="145" r="3" fill="#2d6a4f" opacity="0.7" filter="url(#glow)"/>
  <circle cx="280" cy="145" r="3" fill="#2d6a4f" opacity="0.7" filter="url(#glow)"/>
  <circle cx="120" cy="265" r="3" fill="#2d6a4f" opacity="0.7" filter="url(#glow)"/>
  <circle cx="280" cy="265" r="3" fill="#2d6a4f" opacity="0.7" filter="url(#glow)"/>

  <!-- ── TAGLINE ── -->
  <text x="200" y="310" font-family="'Arial', sans-serif"
        font-size="11" font-weight="400" text-anchor="middle"
        fill="#64748b" letter-spacing="3">READ · ONLY · MEMORY</text>

  <!-- ── OUTER GLOW DOTS ── -->
  <circle cx="200" cy="50" r="2" fill="#2d6a4f" opacity="0.5"/>
  <circle cx="200" cy="350" r="2" fill="#2d6a4f" opacity="0.5"/>
  <circle cx="50" cy="200" r="2" fill="#2d6a4f" opacity="0.5"/>
  <circle cx="350" cy="200" r="2" fill="#2d6a4f" opacity="0.5"/>
</svg>