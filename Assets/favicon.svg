
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="chipFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b4332"/>
      <stop offset="100%" style="stop-color:#0f2d1f"/>
    </linearGradient>
    <linearGradient id="faceFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f17"/>
      <stop offset="100%" style="stop-color:#081510"/>
    </linearGradient>
    <linearGradient id="greenFav" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d6a4f"/>
      <stop offset="100%" style="stop-color:#52b788"/>
    </linearGradient>
    <linearGradient id="pinFav" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7f8ea3"/>
      <stop offset="100%" style="stop-color:#b0bec5"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square — works as app icon -->
  <rect width="32" height="32" rx="7" fill="#0d1b2a"/>

  <!-- Chip body -->
  <rect x="7" y="5" width="18" height="22" rx="2.5" fill="url(#chipFav)"/>
  <!-- Green top accent -->
  <rect x="7" y="5" width="18" height="1.5" rx="1" fill="url(#greenFav)"/>
  <!-- Chip border -->
  <rect x="7" y="5" width="18" height="22" rx="2.5"
        fill="none" stroke="#2d6a4f" stroke-width="0.6" opacity="0.8"/>

  <!-- Left pins -->
  <rect x="3" y="8"  width="4" height="2" rx="0.5" fill="url(#pinFav)"/>
  <rect x="3" y="12" width="4" height="2" rx="0.5" fill="url(#pinFav)"/>
  <rect x="3" y="16" width="4" height="2" rx="0.5" fill="url(#pinFav)"/>
  <rect x="3" y="20" width="4" height="2" rx="0.5" fill="url(#pinFav)"/>
  <rect x="3" y="24" width="4" height="2" rx="0.5" fill="url(#pinFav)"/>

  <!-- Right pins -->
  <rect x="25" y="8"  width="4" height="2" rx="0.5" fill="url(#pinFav)"/>
  <rect x="25" y="12" width="4" height="2" rx="0.5" fill="url(#pinFav)"/>
  <rect x="25" y="16" width="4" height="2" rx="0.5" fill="url(#pinFav)"/>
  <rect x="25" y="20" width="4" height="2" rx="0.5" fill="url(#pinFav)"/>
  <rect x="25" y="24" width="4" height="2" rx="0.5" fill="url(#pinFav)"/>

  <!-- Notch top center -->
  <path d="M13 5 Q16 2 19 5" fill="#0d1b2a" stroke="#2d6a4f" stroke-width="0.5"/>

  <!-- Die face -->
  <rect x="9" y="7" width="14" height="18" rx="1.5" fill="url(#faceFav)"/>

  <!-- ROM text — at 32px needs to be bold and simple -->
  <text x="16" y="19" font-family="'Arial Black', Impact, sans-serif"
        font-size="7" font-weight="900" text-anchor="middle"
        fill="#ffffff" letter-spacing="0.5">ROM</text>

  <!-- Green underline -->
  <rect x="10" y="20.5" width="12" height="1" rx="0.5" fill="url(#greenFav)"/>
</svg>